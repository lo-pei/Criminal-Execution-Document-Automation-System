name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 是交付下限：目标机含 Win7（ADR-013）。不测 3.8 就等于没验证交付用的解释器。
        python-version: ["3.8", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests tools packaging

      - name: Test
        run: python -m pytest -q

  build-preflight:
    # 构建闸门本身也要被验证：若它在干净环境里跑不起来，
    # 交付时才发现「打包机缺 tkinter」就和没做检查一样。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build-win10.txt
          python -m pip install -e . --no-deps

      - name: Build preflight (平台/位数/解释器版本/tkinter/依赖/PyInstaller)
        run: python tools/build_offline.py --check-only --target win10

  guard-sensitive-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认未提交真实案件材料
        run: |
          if git ls-files | grep -Ei '(^|/)(samples|truth|output)/.*\.(txt|xlsx|docx|pdf)$'; then
            echo "::error::检测到 data 目录下的案件材料被提交，违反 SECURITY.md 第 1 条"
            exit 1
          fi
          echo "OK: 未发现案件材料"

      - name: 确认公开语料目录只有摘录
        run: |
          # data/public-corpus 允许入库，但只能放摘录（jsonl）与说明（md）。
          # 原始判决书文件（pdf/txt/docx）一律不得入库——摘录可复核，原件是另一种风险。
          extra=$(git ls-files data/public-corpus | grep -Ev '\.(jsonl|md)$' || true)
          if [ -n "$extra" ]; then
            echo "::error::public-corpus 下出现非摘录文件：$extra"
            exit 1
          fi
          echo "OK: public-corpus 仅含摘录"
